        <path id="wave-path" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z">

      <g class="wave3">
        <use xlink:href="#wave-path" x="50" y="9" fill="#fff">
      </g>

<center>
    <h1>complaint reply</h1>
    <form method="post">
        <table class="table table-striped" align="center" style="width: 80%;">
            <tr>
                <th>Reply</th>
                <td><input type="text" name="reply" placeholder="Enter reply" required class="form-control" required></td>
            </tr>
            <tr>
                <td align="center" colspan="2"><input type="submit" value="SUBMIT" name="submit" class="btn btn-primary" ></td>
            </tr>
        </table>
    </form>
</center>


<script src="
https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js">

<script>
    $(function() {
        $("input[name='reply']").on('input', function(e) {
            $(this).val($(this).val().replace(/[^A-Za-z ]/g, ''));

        });      
    });
</script>
